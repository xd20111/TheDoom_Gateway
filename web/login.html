<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheDoom Gateway — Access Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
    --neon-cyan: #00f0ff;
    --neon-green: #00ff66;
    --dark-bg: #080c14;
    --card-bg: rgba(13, 19, 32, 0.88);
    --border-cyber: rgba(0, 240, 255, 0.22);
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Inter', -apple-system, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
}

body {
    min-height: 100vh;
    background-color: var(--dark-bg);
    color: #e2e8f0;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    overflow-x: hidden;
    position: relative;
}

#cyberCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.cyber-top-header {
    position: absolute;
    top: 24px;
    left: 28px;
    right: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
}

.cyber-logo-link {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #ffffff;
}

.cyber-logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neon-cyan);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
}

.cyber-brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #ffffff;
    letter-spacing: -0.02em;
}

.cyber-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 255, 102, 0.08);
    border: 1px solid rgba(0, 255, 102, 0.3);
    color: var(--neon-green);
    padding: 5px 14px;
    border-radius: 99px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    box-shadow: 0 0 16px rgba(0, 255, 102, 0.15);
}

.pulse-emerald {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--neon-green);
    box-shadow: 0 0 8px var(--neon-green);
    animation: cyberPulse 2s infinite ease-in-out;
}

@keyframes cyberPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.55; }
}

/* Split Layout: Left Login + Right Plain 3D Hologram Logo */
.cyber-split-layout {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1240px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: 460px 1fr;
    gap: 40px;
    align-items: center;
}

.cyber-left-pane {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
}

.login-auth-card {
    background: rgba(13, 19, 32, 0.88);
    border: 1px solid rgba(0, 240, 255, 0.22);
    border-radius: 16px;
    box-shadow: 0 30px 70px -10px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 240, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 28px 26px;
}

.cyber-right-pane {
    position: relative;
    min-height: 640px;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
}

#threejs-viewport {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* Refined Clean Passkey Auth Card */
.auth-header {
    margin-bottom: 24px;
}

.auth-icon-badge {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(99, 91, 255, 0.2));
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    margin-bottom: 14px;
}

.auth-title {
    font-size: 21px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.02em;
}

.auth-sub {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 4px;
}

.auth-input-group {
    margin-bottom: 18px;
}

.auth-input-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 8px;
    font-family: var(--font-mono);
}

.auth-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.cyber-password-input {
    width: 100%;
    padding: 12px 52px 12px 14px;
    background: rgba(6, 11, 20, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    color: #ffffff;
    font-size: 14px;
    font-family: var(--font-mono);
    outline: none;
    transition: all 0.2s ease;
}

.cyber-text-input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(6, 11, 20, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    color: #ffffff;
    font-size: 14px;
    font-family: var(--font-mono);
    outline: none;
    transition: all 0.2s ease;
}

.cyber-password-input:focus,
.cyber-text-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.25), 0 0 16px rgba(0, 240, 255, 0.15);
}

.btn-toggle-eye {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    color: #64748b;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s;
}

.btn-toggle-eye:hover {
    color: var(--neon-cyan);
}

.btn-cyber-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(2, 132, 199, 0.35);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-cyber-login:hover {
    box-shadow: 0 6px 24px rgba(2, 132, 199, 0.55);
    transform: translateY(-1px);
}

.cyber-bottom-footer {
    position: absolute;
    bottom: 20px;
    left: 28px;
    right: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #475569;
    z-index: 10;
}

.node-hex-val {
    color: var(--neon-cyan);
    font-weight: 600;
}

@media (max-width: 980px) {
    .cyber-split-layout {
        grid-template-columns: 1fr;
        max-width: 520px;
        margin: 70px auto 40px;
    }
    .cyber-right-pane {
        min-height: 400px;
        order: -1;
    }
    .cyber-top-header {
        position: static;
        margin-bottom: 20px;
    }
    .cyber-bottom-footer {
        position: static;
        margin-top: 20px;
        flex-direction: column;
        gap: 6px;
        text-align: center;
    }
}
</style>
</head>
<body>
<canvas id="cyberCanvas"></canvas>

<header class="cyber-top-header">
    <a href="/" class="cyber-logo-link">
        <img src="/YourHacker%20logo.png" alt="TheDoom Gateway" style="width: 28px; height: 28px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.6)); border-radius: 6px;">
        <span class="cyber-brand-name">TheDoom Gateway</span>
    </a>
    <div class="cyber-status-pill">
        <span class="pulse-emerald"></span>
        <span>SYSTEM HARDENING · ZERO-TRUST</span>
    </div>
</header>

<div class="cyber-split-layout">
    <!-- LEFT SIDE: Clean TheDoom Gateway Login -->
    <div class="cyber-left-pane">
        <div class="login-auth-card">
            <div class="auth-header">
                <div class="auth-icon-badge" style="background: rgba(0, 255, 102, 0.08); border-color: rgba(0, 255, 102, 0.35); padding: 6px;">
                    <img src="/YourHacker%20logo.png" alt="TheDoom Gateway" style="width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(0, 255, 102, 0.65));">
                </div>
                <h2 class="auth-title">TheDoom Gateway</h2>
                <p class="auth-sub">Windows Account Authentication</p>
            </div>

            {{ERROR_HTML}}
            <form method="post" action="/login" onsubmit="handleSubmitState(this)">
                <div class="auth-input-group">
                    <div class="auth-input-label">
                        <span>WINDOWS USERNAME</span>
                    </div>
                    <div class="auth-input-wrapper">
                        <input class="cyber-text-input" id="username" name="username" type="text" 
                               maxlength="256" required autocomplete="username" 
                               value="{{DEFAULT_USERNAME}}"
                               placeholder="Windows username (e.g. Deepak.Tak)">
                    </div>
                </div>

                <div class="auth-input-group">
                    <div class="auth-input-label">
                        <span>WINDOWS PASSWORD</span>
                    </div>
                    <div class="auth-input-wrapper">
                        <input class="cyber-password-input" id="password" name="password" type="password" 
                               maxlength="256" required autocomplete="current-password" 
                               placeholder="Enter Windows password..." autofocus>
                        <button type="button" class="btn-toggle-eye" onclick="togglePass()">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn-cyber-login" id="btnSubmitLogin">
                    <span>Sign In to Node</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
                <div style="margin-top: 14px; font-size: 11px; color: #64748b; text-align: center; font-family: var(--font-mono);">
                    Authenticated live via Windows LSA / SAM
                </div>
            </form>
        </div>
    </div>

    <!-- RIGHT SIDE: 3D Holographic Logo & Halo Animation (Unboxed & Plain) -->
    <div class="cyber-right-pane">
        <div id="threejs-viewport"></div>
    </div>
</div>

<footer class="cyber-bottom-footer">
    <div>&copy; 2026 TheDoom Gateway · Develop by YourHacker with ❤️</div>
    <div>SYS_NODE: <span class="node-hex-val" id="cyberNodeId">DOOM-NODE-0000</span></div>
</footer>

<script>
function togglePass() {
    const p = document.getElementById('password');
    const btn = document.querySelector('.btn-toggle-eye');
    if (p.type === 'password') {
        p.type = 'text';
        btn.innerText = 'Hide';
    } else {
        p.type = 'password';
        btn.innerText = 'Show';
    }
}

function handleSubmitState(form) {
    const btn = document.getElementById('btnSubmitLogin');
    btn.style.opacity = '0.7';
    btn.innerHTML = '<span>Authenticating Uplink...</span> <span class="pulse-emerald" style="width:7px;height:7px;"></span>';
}

function initCyberCanvas() {
    const canvas = document.getElementById('cyberCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const particles = [];
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5 + 0.8,
            speedY: Math.random() * 0.7 + 0.3,
            alpha: Math.random() * 0.6 + 0.2,
            color: Math.random() > 0.4 ? '#00f0ff' : '#00ff66'
        });
    }

    let offset = 0;
    function draw() {
        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = "rgba(0, 240, 255, 0.07)";
        ctx.lineWidth = 1;
        const horizon = height * 0.62;
        
        offset = (offset + 0.4) % 30;
        for (let y = horizon; y < height; y += (y - horizon) * 0.28 + 12) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }

        const vanishingX = width / 2;
        for (let x = -width * 0.5; x <= width * 1.5; x += 90) {
            ctx.beginPath();
            ctx.moveTo(vanishingX, horizon);
            ctx.lineTo(x, height);
            ctx.stroke();
        }

        for (let p of particles) {
            p.y -= p.speedY;
            if (p.y < 0) {
                p.y = height;
                p.x = Math.random() * width;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        requestAnimationFrame(draw);
    }
    draw();
}

// 3D Holographic Logo Scene from ref.php
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
});

function initThreeJsHologramScene() {
    const container = document.getElementById('threejs-viewport');
    if (!container || typeof THREE === 'undefined') return;

    const width = container.clientWidth || 600;
    const height = container.clientHeight || 580;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 0, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(width, height);
    container.innerHTML = '';
    container.appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    // 1. Ground Grid Bed
    const gridHelper = new THREE.GridHelper(50, 36, 0x00ff66, 0x02160a);
    gridHelper.position.y = -5.2;
    group.add(gridHelper);

    // 2. Holographic vertical projection beam (subtle emitter cone)
    const coneGeo = new THREE.ConeGeometry(4.0, 5.0, 32, 1, true);
    const coneMat = new THREE.MeshBasicMaterial({
        color: 0x00ff88,
        transparent: true,
        opacity: 0.035,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    });
    const hologramCone = new THREE.Mesh(coneGeo, coneMat);
    hologramCone.position.y = -2.8;
    group.add(hologramCone);

    // 3. Hologram scanning ring
    const ringGeo = new THREE.RingGeometry(0.1, 4.4, 32);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0x00ffaa,
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    });
    const scanRing = new THREE.Mesh(ringGeo, ringMat);
    scanRing.rotation.x = Math.PI / 2;
    group.add(scanRing);

    // 4. Floating wireframe halo globe (electric cyan orbit)
    const haloGeo = new THREE.SphereGeometry(6.2, 20, 20);
    const haloMat = new THREE.MeshBasicMaterial({
        color: 0x00f0ff,
        wireframe: true,
        transparent: true,
        opacity: 0.08,
        blending: THREE.AdditiveBlending
    });
    const haloMesh = new THREE.Mesh(haloGeo, haloMat);
    haloMesh.position.y = 1.0;
    group.add(haloMesh);

    // 5. Upward cyber particles
    const particleCount = 450;
    const pointsGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const velocities = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = Math.random() * 40 - 20;
        positions[i * 3 + 1] = Math.random() * 30 - 15;
        positions[i * 3 + 2] = Math.random() * 40 - 20;
        velocities[i] = 0.03 + Math.random() * 0.05;
    }
    pointsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pointsMaterial = new THREE.PointsMaterial({
        color: 0x00ffaa,
        size: 0.12,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(pointsGeometry, pointsMaterial);
    scene.add(particles);

    // 6. Authentic YourHacker 3D Logo Hologram
    const textureLoader = new THREE.TextureLoader();
    const logoTexture = textureLoader.load('/YourHacker%20logo.png');
    logoTexture.generateMipmaps = false;
    logoTexture.minFilter = THREE.LinearFilter;
    logoTexture.magFilter = THREE.LinearFilter;

    // Authentic pirate skull shield plane
    const logoMaterial = new THREE.MeshBasicMaterial({
        map: logoTexture,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false
    });
    const logoGeometry = new THREE.PlaneGeometry(10.5, 10.5);
    const logoMesh = new THREE.Mesh(logoGeometry, logoMaterial);
    logoMesh.position.y = 1.0;
    group.add(logoMesh);

    // Glowing hologram back-plane for cyber aura
    const glowMaterial = new THREE.MeshBasicMaterial({
        map: logoTexture,
        transparent: true,
        opacity: 0.36,
        side: THREE.DoubleSide,
        depthWrite: false,
        blending: THREE.AdditiveBlending
    });
    const glowGeometry = new THREE.PlaneGeometry(12.2, 12.2);
    const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
    glowMesh.position.set(0, 1.0, -0.2);
    group.add(glowMesh);

    // 7. Animation Loop
    const clock = new THREE.Clock();
    let targetRotationX = 0;
    let targetRotationY = 0;

    function animateThree() {
        requestAnimationFrame(animateThree);
        const time = clock.getElapsedTime();

        const logoY = 1.0 + Math.sin(time * 0.6) * 0.28;
        logoMesh.position.y = logoY;
        glowMesh.position.y = logoY;
        haloMesh.position.y = logoY;

        logoMesh.rotation.y = Math.sin(time * 0.5) * 0.22;
        logoMesh.rotation.z = Math.cos(time * 0.3) * 0.08;
        glowMesh.rotation.y = logoMesh.rotation.y;
        glowMesh.rotation.z = logoMesh.rotation.z;

        haloMesh.rotation.y = -time * 0.09;
        haloMesh.rotation.x = time * 0.045;

        const scanY = -5.2 + ((time * 1.5) % 6.8);
        scanRing.position.y = scanY;
        const pct = (scanY - (-5.2)) / 6.8;
        const currentRadius = 4.8 * (1 - pct);
        scanRing.scale.set(currentRadius, currentRadius, 1);

        const positionsArr = particles.geometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
            positionsArr[i * 3 + 1] += velocities[i];
            if (positionsArr[i * 3 + 1] > 15) {
                positionsArr[i * 3 + 1] = -15;
                positionsArr[i * 3] = Math.random() * 40 - 20;
                positionsArr[i * 3 + 2] = Math.random() * 40 - 20;
            }
        }
        particles.geometry.attributes.position.needsUpdate = true;
        particles.rotation.y = time * 0.03;

        targetRotationY = THREE.MathUtils.lerp(targetRotationY, mouseX * 0.7, 0.05);
        targetRotationX = THREE.MathUtils.lerp(targetRotationX, mouseY * 0.7, 0.05);
        group.rotation.y = targetRotationY;
        group.rotation.x = targetRotationX;

        renderer.render(scene, camera);
    }
    animateThree();

    window.addEventListener('resize', () => {
        if (!container.clientWidth || !container.clientHeight) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
}

window.addEventListener('DOMContentLoaded', () => {
    const hex = "0123456789ABCDEF";
    let nodeId = "DOOM-NODE-";
    for (let i = 0; i < 4; i++) {
        nodeId += hex[Math.floor(Math.random() * 16)];
    }
    const el = document.getElementById('cyberNodeId');
    if (el) el.textContent = nodeId;
    const elHud = document.getElementById('cyberNodeIdHud');
    if (elHud) elHud.textContent = nodeId;

    initCyberCanvas();
    initThreeJsHologramScene();
});
</script>
</body>
</html>
